[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-cx"
version = "0.1.0"
description = "Token concept-based explanations for Vision Transformers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Vu Trinh Nguyen Hoang" },
]

keywords = [
    "explainable-ai",
    "concept-based-explanations",
    "vision-transformers",
    "nmf",
    "interpretability",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "huggingface-hub>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "safetensors>=0.4",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
data = [
    "datasets>=3.0",
]
test = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/VuTrinhNguyenHoang/Token-CX"
Repository = "https://github.com/VuTrinhNguyenHoang/Token-CX"
Artifacts = "https://huggingface.co/datasets/trinhvu21/token-cx-artifacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
